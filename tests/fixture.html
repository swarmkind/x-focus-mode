<!doctype html><html lang="en"><head><meta charset="utf-8"><title>X Focus Mode — demo feed</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d141a;color:#e4ecea;font:16px/1.5 system-ui}main{display:grid;grid-template-columns:210px 610px 280px;max-width:1160px;margin:auto;gap:24px}nav{padding:34px 12px;font-size:20px}nav a{display:block;color:inherit;text-decoration:none;margin:24px 0}h1{font-size:22px;line-height:1.3}.logo{font-size:40px;color:#b4dbc4}.feed{border-left:1px solid #2c3a42;border-right:1px solid #2c3a42;min-height:100vh}.top{padding:22px;border-bottom:1px solid #2c3a42;display:flex;justify-content:space-between}.top span{color:#9eb3b6}article{padding:18px 22px;border-bottom:1px solid #2c3a42;min-height:180px}.author{display:flex;gap:12px;margin-bottom:10px}.avatar{width:40px;height:40px;border-radius:50%;background:#30454a;display:grid;place-items:center;color:#bed8cf}.name{font-size:14px}.name span{color:#8eaaa9}.name a{color:#8eaaa9;text-decoration:none}.actions{font-size:12px;color:#8eaaa9;display:flex;justify-content:space-between;margin-top:18px}aside{padding-top:30px}.demo{border:1px solid #45645f;border-radius:12px;background:#192b2e;padding:20px;font-size:13px;color:#b7ceca}.demo b{display:block;letter-spacing:.15em;font-size:10px;color:#c8e6d4;margin-bottom:10px}.demo p{margin-bottom:0}a{color:#b4dbc4}.tabs{font-size:14px;display:flex;justify-content:space-around;padding:15px;border-bottom:1px solid #2c3a42}.tabs b{border-bottom:3px solid #b4dbc4;padding-bottom:8px}

</style></head><body><main><nav><div class="logo">◌</div><h1>Your feed,<br>a little quieter.</h1><a href="/home">⌂ &nbsp; Home</a><a data-testid="AppTabBar_Profile_Link" href="/demo_viewer">◯ &nbsp; Profile</a></nav><div class="feed"><div class="top"><strong>Home</strong><span>X Focus Mode</span></div><div class="tabs"><b>For you</b><span>Following</span></div><div id="posts"></div></div><aside><div class="demo"><b>CONTROLLED DEMO DATA</b>Fictional posts. Real extension controls.<p>The model responses in this fixture are scripted for testing. No live accuracy claim is implied.</p></div></aside></main><script>
window.fixturePosts=[
{id:'1000000000000000001',author:'CircuitNotes',name:'Circuit Notes',text:'Reply YES and repost this in the next 10 minutes to receive my secret AI prompts. Only people who engage will get access. Don’t miss out.',category:'engagement_farming'},
{id:'1000000000000000002',author:'FieldJournal',name:'Field Journal',text:'Built a small soil moisture monitor this weekend. The useful part was measuring how slowly the raised bed dries after rain. Here are the wiring notes and what I would change.',relevant:true},

window.renderPost=function(p){const a=document.createElement('article');a.dataset.testid='tweet';a.dataset.id=p.id;const content=document.createElement('div');const header=document.createElement('div');header.className='author';const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=p.name[0];const name=document.createElement('div');name.className='name';const strong=document.createElement('strong');strong.textContent=p.name;const handle=document.createElement('span');handle.textContent=' @'+p.author+' · ';const link=document.createElement('a');link.href='/'+p.author+'/status/'+p.id;const time=document.createElement('time');time.textContent='2m';link.append(time);name.append(strong,document.createElement('br'),handle,link);header.append(avatar,name);const text=document.createElement('div');text.dataset.testid='tweetText';text.textContent=p.text;content.append(header,text);if(p.protected){const lock=document.createElement('span');lock.dataset.testid='icon-lock';lock.textContent='Protected account';content.append(lock);}const actions=document.createElement('div');actions.className='actions';actions.textContent='↩ 12                 ⇄ 24                 ♡ 103                  ↗';content.append(actions);a.append(content);return a;};
window.loadFixture=function(){const posts=document.getElementById('posts');posts.replaceChildren(...window.fixturePosts.map(window.renderPost));window.postMessage({type:'xfm-public-metadata-v1',posts:window.fixturePosts.map(p=>({id:p.id,author:p.author,public:!p.protected}))},location.origin);};window.loadFixture();
function announceMetadata(){window.postMessage({type:'xfm-public-metadata-v1',posts:window.fixturePosts.map(p=>({id:p.id,author:p.author,public:!p.protected}))},location.origin);}
window.addEventListener('message',event=>{if(event.data?.type==='xfm-metadata-enabled'&&event.data.enabled)announceMetadata();});setTimeout(announceMetadata,150);
</script></body></html>
