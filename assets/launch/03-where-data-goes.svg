<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
<title id="title">Know what leaves your computer.</title><desc id="desc">Three ways to review posts. Sharing and distribution have separate switches.</desc>
<rect width="1080" height="1350" fill="#101b20"/>
<g font-family="Arial, Helvetica, sans-serif">
<g transform="translate(58 46) scale(1.1)"><path d="M25 15H15V25M39 15H49V25M49 39V49H39M25 49H15V39" fill="none" stroke="#b4dbc4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="32" r="6" fill="#b4dbc4"/></g><text x="145" y="91" fill="#b4dbc4" font-size="24" font-weight="700">X FOCUS MODE</text>
<text x="826" y="91" fill="#a8bcb8" font-size="17" font-weight="400">GUIDE 03 / 03</text>
<text x="72" y="202" fill="#e4eee9" font-size="66" font-weight="400">Know what leaves</text><text x="72" y="297.7" fill="#e4eee9" font-size="66" font-weight="400">your computer.</text>
<text x="76" y="340" fill="#a8bcb8" font-size="25" font-weight="400">Three ways to review posts.</text><text x="76" y="376.25" fill="#a8bcb8" font-size="25" font-weight="400">Sharing and distribution have separate switches.</text>
<rect x="76" y="428" width="928" height="158" rx="20" fill="#17282d" stroke="#36504f"/>
  <circle cx="125" cy="475" r="22" fill="none" stroke="#b4dbc4"/>
  <text x="125" y="482" text-anchor="middle" fill="#b4dbc4" font-size="18" font-weight="700">A</text>
  <text x="166" y="483" fill="#e4eee9" font-size="30" font-weight="700">Your API provider</text>
  <text x="166" y="524" fill="#a8bcb8" font-size="24" font-weight="400">Receives eligible public post text and your interests.</text><text x="166" y="558.8" fill="#a8bcb8" font-size="24" font-weight="400">Your key is sent only to the configured provider.</text><rect x="76" y="604" width="928" height="158" rx="20" fill="#17282d" stroke="#36504f"/>
  <circle cx="125" cy="651" r="22" fill="none" stroke="#b4dbc4"/>
  <text x="125" y="658" text-anchor="middle" fill="#b4dbc4" font-size="18" font-weight="700">B</text>
  <text x="166" y="659" fill="#e4eee9" font-size="30" font-weight="700">Local Ollama</text>
  <text x="166" y="700" fill="#a8bcb8" font-size="24" font-weight="400">Receives text and interests on this computer.</text><text x="166" y="734.8" fill="#a8bcb8" font-size="24" font-weight="400">Requires an installed model and a running local service.</text><rect x="76" y="780" width="928" height="180" rx="20" fill="#17282d" stroke="#36504f"/>
  <circle cx="125" cy="827" r="22" fill="none" stroke="#b4dbc4"/>
  <text x="125" y="834" text-anchor="middle" fill="#b4dbc4" font-size="18" font-weight="700">C</text>
  <text x="166" y="835" fill="#e4eee9" font-size="30" font-weight="700">Community network</text>
  <text x="166" y="876" fill="#a8bcb8" font-size="24" font-weight="400">Reports: tweet ID, categories, human/model source,</text><text x="166" y="910.8" fill="#a8bcb8" font-size="24" font-weight="400">model name, signing key, signature, revision and expiry.</text><text x="88" y="1014" fill="#e4eee9" font-size="24" font-weight="400">No tweet text, handles, API keys or reveal history in reports.</text><text x="88" y="1048.8" fill="#e4eee9" font-size="24" font-weight="400">Signing keys link contributions. Peers can see your public IP.</text><text x="88" y="1083.6" fill="#e4eee9" font-size="24" font-weight="400">Signed does not mean true. Shared copies can remain.</text><text x="88" y="1118.4" fill="#e4eee9" font-size="24" font-weight="400">Nothing activates before disclosure, acceptance and Save.</text>
<path d="M76 1210H1004" stroke="#36504f"/>
<text x="76" y="1256" fill="#b4dbc4" font-size="25" font-weight="700">@swarmkind</text>
<text x="1004" y="1256" text-anchor="end" fill="#a8bcb8" font-size="17" font-weight="400">OPEN SOURCE · DEVELOPER PREVIEW</text>
<text x="76" y="1294" fill="#a8bcb8" font-size="20" font-weight="400">github.com/swarmkind/x-focus-mode</text>
</g></svg>